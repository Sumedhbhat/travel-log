name: Build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Build
    # Dependabot runs can't read the Build environment's secrets. Placeholders
    # are enough to get past the env check in `nuxt prepare`.
    env:
      NODE_ENV: production
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL || 'file:local.db' }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://localhost:3000' }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'ci-placeholder' }}
      GH_CLIENT_ID: ${{ secrets.GH_CLIENT_ID || 'ci-placeholder' }}
      GH_CLIENT_SECRET: ${{ secrets.GH_CLIENT_SECRET || 'ci-placeholder' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3+sha512.467df2c586056165580ad6dfb54ceaad94c5a30f80893ebdec5a44c5aa73c205ae4a5bb9d5ed6bb84ea7c249ece786642bbb49d06a307df218d03da41c317417

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm lint

      - name: Build and test GitHub OAuth
        env:
          TURSO_DATABASE_URL: file:local.db
          TURSO_AUTH_TOKEN: ""
          BETTER_AUTH_URL: http://localhost:3000
          BETTER_AUTH_SECRET: local-security-test-secret-with-more-than-32-characters
          GH_CLIENT_ID: local-fixture-client
          GH_CLIENT_SECRET: local-fixture-secret
          BETTER_AUTH_TELEMETRY_ENABLED: "false"
        run: |
          pnpm build
          pnpm test:auth
